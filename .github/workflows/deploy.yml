name: Deploy subsidy site

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-subsidy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 카드 마크업 사전 렌더링
        run: node tools/build-cards.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy public --project-name=subsidy --branch=main
      # 검색엔진 통보가 실패해도 배포는 이미 끝났으므로 작업을 실패로 만들지 않는다.
      - name: IndexNow로 네이버·빙에 변경 알림
        continue-on-error: true
        run: |
          sleep 30
          node tools/indexnow.mjs
